name: Flutter Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          unzip chat_yemen.zip -d extracted_project
          PROJ_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Fix pubspec and dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          with open('pubspec.yaml', 'r', encoding='utf-8') as f:
              content = f.read()

          # إصلاح التبعيات المتعارضة
          content = content.replace('nearby_connections: ^5.0.0', 'nearby_connections: ^4.2.0')
          content = content.replace('nearby_connections: 5.0.0', 'nearby_connections: ^4.2.0')
          content = content.replace('flutter_riverpod: ^3.0.0', 'flutter_riverpod: ^2.5.1')
          content = content.replace('flutter_riverpod: 3.0.0', 'flutter_riverpod: ^2.5.1')
          content = content.replace('build_runner: ^2.4.8', 'build_runner: ^2.4.6')
          content = content.replace('build_runner: 2.4.8', 'build_runner: ^2.4.6')

          # إضافة المكتبات المطلوبة للخصائص الجديدة
          deps_to_add = []
          for lib, ver in [
              ('qr_flutter', '^4.1.0'),
              ('mobile_scanner', '^5.0.0'),
              ('permission_handler', '^11.3.0'),
              ('network_info_plus', '^5.0.1')
          ]:
              if lib not in content:
                  deps_to_add.append(f'  {lib}: {ver}')

          if deps_to_add:
              new_deps = 'dependencies:\n' + '\n'.join(deps_to_add)
              content = content.replace('dependencies:', new_deps)

          with open('pubspec.yaml', 'w', encoding='utf-8') as f:
              f.write(content)
          "
          rm -f pubspec.lock

      - name: Force Android Compile SDK 36 Globally
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import os, glob, re

          # 1. تعديل كافة ملفات build.gradle الموجودة في المشروع
          for file_path in glob.glob('**/build.gradle*', recursive=True):
              try:
                  with open(file_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  new_content = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', content)
                  new_content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', new_content)
                  new_content = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 36', new_content)
                  new_content = re.sub(r'targetSdk\s+\d+', 'targetSdk 36', new_content)
                  
                  if new_content != content:
                      with open(file_path, 'w', encoding='utf-8') as f:
                          f.write(new_content)
              except Exception:
                  pass
          "

      - name: Inject Android Permissions
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import os
          path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(path):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              perms = '''
    <uses-permission android:name=\"android.permission.INTERNET\" />
    <uses-permission android:name=\"android.permission.CAMERA\" />
    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />
    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />
    <uses-permission android:name=\"android.permission.CHANGE_WIFI_STATE\" />
    <uses-permission android:name=\"android.permission.ACCESS_WIFI_STATE\" />
    <uses-permission android:name=\"android.permission.BLUETOOTH\" />
    <uses-permission android:name=\"android.permission.BLUETOOTH_ADMIN\" />
    <uses-permission android:name=\"android.permission.BLUETOOTH_SCAN\" />
    <uses-permission android:name=\"android.permission.BLUETOOTH_ADVERTISE\" />
    <uses-permission android:name=\"android.permission.BLUETOOTH_CONNECT\" />
    <uses-permission android:name=\"android.permission.NEARBY_WIFI_DEVICES\" />
              '''
              if 'INTERNET' not in content:
                  content = content.replace('<manifest', '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n' + perms)
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
          "

      - name: Rewrite encryption_service.dart cleanly
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import glob

          complete_code = '''import 'dart:convert';
          import 'dart:typed_data';
          import 'dart:math';
          import 'package:cryptography/cryptography.dart';

          class EncryptionService {
            static final _algorithm = AesCbc.with256bits(macAlgorithm: Hmac.sha256());

            static String generateKey() {
              final random = Random.secure();
              final values = List<int>.generate(32, (i) => random.nextInt(256));
              return base64.encode(values);
            }

            static Future<String> encryptText(String text, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final secretBox = await _algorithm.encrypt(
                utf8.encode(text),
                secretKey: secretKey,
              );
              return base64.encode(secretBox.concatenation());
            }

            static Future<String> decryptText(String encryptedText, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final bytes = base64.decode(encryptedText);
              final secretBox = SecretBox.fromConcatenation(
                bytes,
                nonceLength: 12,
                macLength: 32,
              );
              final clearBytes = await _algorithm.decrypt(
                secretBox,
                secretKey: secretKey,
              );
              return utf8.decode(clearBytes);
            }

            static Future<List<int>> encryptFile(List<int> fileData, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final secretBox = await _algorithm.encrypt(
                fileData,
                secretKey: secretKey,
              );
              return secretBox.concatenation();
            }

            static Future<List<int>> decryptFile(List<int> encryptedData, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              return await _algorithm.decrypt(
                SecretBox.fromConcatenation(
                  encryptedData,
                  nonceLength: 12,
                  macLength: 32,
                ),
                secretKey: secretKey,
              );
            }
          }
          '''

          files = glob.glob('**/encryption_service.dart', recursive=True)
          for path in files:
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(complete_code)
          "

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build and Setup
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter create . --platforms=android
          
          # فرض compileSdk 36 مباشرة في جذر Gradle للمشروع والـ Plugins الحزمية
          python3 -c "
          import os
          root_gradle = 'android/build.gradle'
          if os.path.exists(root_gradle):
              with open(root_gradle, 'r', encoding='utf-8') as f:
                  g_content = f.read()
              
              sub_config = '''
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                          buildToolsVersion '34.0.0'
                      }
                  }
              }
          }
          '''
              if 'subprojects' not in g_content:
                  with open(root_gradle, 'a', encoding='utf-8') as f:
                      f.write(sub_config)
          "
          
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-yemen-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
