name: Flutter Build & Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          unzip chat_yemen.zip -d extracted_project
          PROJ_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJ_DIR" ]; then 
            echo "❌ pubspec.yaml not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV
          echo "✅ Project found at: $PROJ_DIR"

      - name: Setup Icon + Dependencies + Assets
        run: |
          cd ${{ env.PROJECT_DIR }}
          mkdir -p assets/images
          
          # استخدم الصورة من جذر الريبو كأيقونة. لو مش موجودة بنعمل وهمية
          if [ -f "$GITHUB_WORKSPACE/icon.png" ]; then
            cp $GITHUB_WORKSPACE/icon.png assets/images/icon.png
            echo "✅ Using icon.png from repo root"
          else
            echo "⚠️ icon.png not found. Creating dummy icon"
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > assets/images/icon.png
          fi

          python3 << 'EOF'
          with open('pubspec.yaml', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # اضافة المكتبات المطلوبة
          deps = {
              'qr_flutter': '^4.1.0',
              'mobile_scanner': '^5.0.0',
              'permission_handler': '^11.3.0',
              'network_info_plus': '^5.0.1'
          }
          
          for dep, ver in deps.items():
              if dep not in content:
                  content = content.replace('dependencies:', f'dependencies:\n  {dep}: {ver}', 1)
                  print(f'✅ Added {dep}')
          
          # اضافة dev_dependencies
          if 'dev_dependencies:' not in content:
              content += '\ndev_dependencies:\n'
          
          # اضافة flutter_launcher_icons
          if 'flutter_launcher_icons:' not in content:
              content = content.replace('dev_dependencies:', 'dev_dependencies:\n  flutter_launcher_icons: ^0.13.1\n', 1)
              content += '\nflutter_launcher_icons:\n  android: "launcher_icon"\n  ios: true\n  image_path: "assets/images/icon.png"\n  min_sdk_android: 21\n'
              print('✅ Added flutter_launcher_icons')
          
          # اضافة assets
          if 'assets:' not in content:
              content += '\nflutter:\n  assets:\n    - assets/images/\n'
              print('✅ Added assets folder')
          
          with open('pubspec.yaml', 'w', encoding='utf-8') as f:
              f.write(content)
          
          print('✅ pubspec.yaml updated')
          EOF
          
          rm -f pubspec.lock

      - name: Inject Android Permissions
        run: |
          cd ${{ env.PROJECT_DIR }}
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i '/<manifest/a\<uses-permission android:name="android.permission.INTERNET" />\<uses-permission android:name="android.permission.CAMERA" />\<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />' "$MANIFEST"
            sed -i '/<application/a\    <uses-feature android:name="android.hardware.camera" android:required="false" />' "$MANIFEST"
            echo "✅ Permissions added"
          else
            echo "ℹ️ Permissions already exist"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.22.0
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'

      - name: Set minSdkVersion 21
        run: |
          GRADLE="${{ env.PROJECT_DIR }}/android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/' "$GRADLE"
            echo "✅ minSdk set to 21"
          fi

      - name: Flutter pub get
        run: cd ${{ env.PROJECT_DIR }} && flutter pub get

      - name: Generate Launcher Icons
        run: cd ${{ env.PROJECT_DIR }} && flutter pub run flutter_launcher_icons

      - name: Build Release APK
        run: cd ${{ env.PROJECT_DIR }} && flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatYemen-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
