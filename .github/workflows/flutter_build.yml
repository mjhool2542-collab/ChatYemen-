name: Flutter Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          unzip chat_yemen_2026_pro_finall.zip -d extracted_project
          PROJ_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Fix pubspec dependencies & Assets
        run: |
          cd ${{ env.PROJECT_DIR }}
          sed -i 's/nearby_connections: ^5.0.0/nearby_connections: any/g' pubspec.yaml
          sed -i 's/flutter_riverpod: .*/flutter_riverpod: any/g' pubspec.yaml
          rm -f pubspec.lock
          mkdir -p assets/images assets/icons

      - name: Rewrite encryption_service.dart cleanly
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import glob

          complete_code = '''import 'dart:convert';
          import 'dart:typed_data';
          import 'dart:math';
          import 'package:cryptography/cryptography.dart';

          class EncryptionService {
            static final _algorithm = AesCbc.with256bits(macAlgorithm: Hmac.sha256());

            static String generateKey() {
              final random = Random.secure();
              final values = List<int>.generate(32, (i) => random.nextInt(256));
              return base64.encode(values);
            }

            static Future<String> encryptText(String text, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final secretBox = await _algorithm.encrypt(
                utf8.encode(text),
                secretKey: secretKey,
              );
              return base64.encode(secretBox.concatenation());
            }

            static Future<String> decryptText(String encryptedText, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final bytes = base64.decode(encryptedText);
              final secretBox = SecretBox.fromConcatenation(
                bytes,
                nonceLength: 12,
                macLength: 32,
              );
              final clearBytes = await _algorithm.decrypt(
                secretBox,
                secretKey: secretKey,
              );
              return utf8.decode(clearBytes);
            }

            static Future<List<int>> encryptFile(List<int> fileData, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final secretBox = await _algorithm.encrypt(
                fileData,
                secretKey: secretKey,
              );
              return secretBox.concatenation();
            }

            static Future<List<int>> decryptFile(List<int> encryptedData, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final secretBox = SecretBox.fromConcatenation(
                encryptedData,
                nonceLength: 12,
                macLength: 32,
              );
              return await _algorithm.decrypt(
                secretBox,
                secretKey: secretKey,
              );
            }
          }
          '''

          files = glob.glob('**/encryption_service.dart', recursive=True)
          for path in files:
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(complete_code)
              print(f'Successfully replaced: {path}')
          "

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies & Re-generate Android
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter create . --platforms=android
          flutter pub get

      - name: Configure Android SDK Version Safely
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import os

          # إضافة إعدادات SDK إلى local.properties ليقرأها Flutter تلقائياً
          with open('android/local.properties', 'a', encoding='utf-8') as f:
              f.write('\nflutter.compileSdkVersion=36\nflutter.targetSdkVersion=36\n')

          # استبدال صريح وآمن في ملفات Gradle لمنع الأخطاء التركيبية
          target_file = 'android/app/build.gradle.kts'
          if os.path.exists(target_file):
              with open(target_file, 'r', encoding='utf-8') as f:
                  content = f.read()
              # تعديل compileSdk السليم لـ Kotlin DSL
              lines = content.splitlines()
              new_lines = []
              for line in lines:
                  if 'compileSdk' in line and '=' in line:
                      new_lines.append('    compileSdk = 36')
                  elif 'compileSdkVersion' in line:
                      new_lines.append('    compileSdkVersion 36')
                  elif 'targetSdk' in line and '=' in line:
                      new_lines.append('    targetSdk = 36')
                  elif 'targetSdkVersion' in line:
                      new_lines.append('    targetSdkVersion 36')
                  else:
                      new_lines.append(line)
              with open(target_file, 'w', encoding='utf-8') as f:
                  f.write('\n'.join(new_lines))
          "

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies & Re-generate Android
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter create . --platforms=android
          flutter pub get

      - name: Force Android Compile SDK 36
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import glob, re

          # 1. إدراج القيم في local.properties
          with open('android/local.properties', 'a', encoding='utf-8') as f:
              f.write('\nflutter.compileSdkVersion=36\nflutter.targetSdkVersion=36\n')

          # 2. التعديل في جميع ملفات build.gradle / build.gradle.kts
          gradle_files = glob.glob('android/**/*.gradle*', recursive=True)
          for path in gradle_files:
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              content = re.sub(r'compileSdkVersion\s+[\d\w_.]+', 'compileSdkVersion 36', content)
              content = re.sub(r'compileSdk\s*=\s*[\d\w_.]+', 'compileSdk = 36', content)
              content = re.sub(r'targetSdkVersion\s+[\d\w_.]+', 'targetSdkVersion 36', content)
              content = re.sub(r'targetSdk\s*=\s*[\d\w_.]+', 'targetSdk = 36', content)
              
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print(f'Updated Gradle config: {path}')
          "

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies & Upgrade Android SDK Version
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter create . --platforms=android
          
          # رفع compileSdkVersion و targetSdkVersion إلى 36
          find android -name "build.gradle*" -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/compileSdk = .*/compileSdk = 36/g' {} +
          
          flutter pub get

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies & Repairs Android files
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter create . --platforms=android
          flutter pub get

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
