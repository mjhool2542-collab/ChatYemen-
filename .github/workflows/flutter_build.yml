name: Flutter Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          unzip chat_yemen_2026_pro_finall.zip -d extracted_project
          PROJ_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Fix pubspec dependencies & Assets
        run: |
          cd ${{ env.PROJECT_DIR }}
          sed -i 's/nearby_connections: ^5.0.0/nearby_connections: any/g' pubspec.yaml
          sed -i 's/flutter_riverpod: .*/flutter_riverpod: any/g' pubspec.yaml
          
          # إضافة جميع المكتبات اللازمة للـ QR والسرعة العالية وتحديث الأيقونة
          python3 -c "
          with open('pubspec.yaml', 'r', encoding='utf-8') as f:
              content = f.read()
          
          needed_deps = '''
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  permission_handler: ^11.3.0
  network_info_plus: ^5.0.1
'''
          if 'qr_flutter' not in content:
              content = content.replace('dependencies:', 'dependencies:' + needed_deps)
          
          if 'dev_dependencies:' in content and 'flutter_launcher_icons:' not in content:
              content = content.replace('dev_dependencies:', 'dev_dependencies:\n  flutter_launcher_icons: ^0.13.1')
          elif 'flutter_launcher_icons:' not in content:
              content += '\ndev_dependencies:\n  flutter_launcher_icons: ^0.13.1\n'
          
          with open('pubspec.yaml', 'w', encoding='utf-8') as f:
              f.write(content)
          "
          rm -f pubspec.lock
          mkdir -p assets/images assets/icons

      - name: Inject App Icon Configuration
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import os, glob

          image_files = glob.glob('assets/images/*.*')
          icon_path = 'assets/images/icon.png'
          if image_files:
              icon_path = image_files[0]
              print(f'Found image for icon: {icon_path}')

          icon_config = f'''
flutter_launcher_icons:
  android: \"launcher_icon\"
  ios: true
  image_path: \"{icon_path}\"
  min_sdk_android: 21
'''
          with open('pubspec.yaml', 'a', encoding='utf-8') as f:
              f.write(icon_config)
          "

      - name: Inject Full Android Permissions
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import os

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              permissions = '''
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.CHANGE_WIFI_STATE\" />
              <uses-permission android:name=\"android.permission.ACCESS_WIFI_STATE\" />
              <uses-permission android:name=\"android.permission.CHANGE_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />
              <uses-permission android:name=\"android.permission.NEARBY_WIFI_DEVICES\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
              '''
              
              if '<uses-permission' not in content:
                  content = content.replace('<manifest', '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n' + permissions)
                  with open(manifest_path, 'w', encoding='utf-8') as f:
                      f.write(content)
          "

      - name: Rewrite encryption_service.dart cleanly
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import glob

          complete_code = '''import 'dart:convert';
          import 'dart:typed_data';
          import 'dart:math';
          import 'package:cryptography/cryptography.dart';

          class EncryptionService {
            static final _algorithm = AesCbc.with256bits(macAlgorithm: Hmac.sha256());

            static String generateKey() {
              final random = Random.secure();
              final values = List<int>.generate(32, (i) => random.nextInt(256));
              return base64.encode(values);
            }

            static Future<String> encryptText(String text, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final secretBox = await _algorithm.encrypt(
                utf8.encode(text),
                secretKey: secretKey,
              );
              return base64.encode(secretBox.concatenation());
            }

            static Future<String> decryptText(String encryptedText, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final bytes = base64.decode(encryptedText);
              final secretBox = SecretBox.fromConcatenation(
                bytes,
                nonceLength: 12,
                macLength: 32,
              );
              final clearBytes = await _algorithm.decrypt(
                secretBox,
                secretKey: secretKey,
              );
              return utf8.decode(clearBytes);
            }

            static Future<List<int>> encryptFile(List<int> fileData, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final secretBox = await _algorithm.encrypt(
                fileData,
                secretKey: secretKey,
              );
              return secretBox.concatenation();
            }

            static Future<List<int>> decryptFile(List<int> encryptedData, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final secretBox = SecretBox.fromConcatenation(
                encryptedData,
                nonceLength: 12,
                macLength: 32,
              );
              return await _algorithm.decrypt(
                secretBox,
                secretKey: secretKey,
              );
            }
          }
          '''

          files = glob.glob('**/encryption_service.dart', recursive=True)
          for path in files:
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(complete_code)
          "

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies & Generate Launcher Icons
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter create . --platforms=android
          flutter pub get
          dart run flutter_launcher_icons || true

      - name: Force Patch All Pub Cache Packages to SDK 36
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import glob, re

          pub_cache_gradles = glob.glob('/home/runner/.pub-cache/hosted/pub.dev/**/build.gradle', recursive=True)
          for gfile in pub_cache_gradles:
              try:
                  with open(gfile, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  new_content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', content)
                  new_content = re.sub(r'compileSdk\s+=\s+\d+', 'compileSdk = 36', new_content)
                  new_content = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', new_content)
                  
                  if new_content != content:
                      with open(gfile, 'w', encoding='utf-8') as f:
                          f.write(new_content)
              except Exception as e:
                  pass
          "

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-yemen-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          overwrite: true

