name: Flutter Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          unzip chat_yemen.zip -d extracted_project
          PROJ_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Fix pubspec and dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          with open('pubspec.yaml', 'r', encoding='utf-8') as f:
              content = f.read()

          content = content.replace('nearby_connections: ^5.0.0', 'nearby_connections: ^4.2.0')
          content = content.replace('nearby_connections: 5.0.0', 'nearby_connections: ^4.2.0')
          content = content.replace('flutter_riverpod: ^3.0.0', 'flutter_riverpod: ^2.5.1')
          content = content.replace('flutter_riverpod: 3.0.0', 'flutter_riverpod: ^2.5.1')
          content = content.replace('build_runner: ^2.4.8', 'build_runner: ^2.4.6')
          content = content.replace('build_runner: 2.4.8', 'build_runner: ^2.4.6')

          deps = ['qr_flutter: ^4.1.0', 'mobile_scanner: ^5.0.0', 'permission_handler: ^11.3.0', 'network_info_plus: ^5.0.1']
          for d in deps:
              pkg = d.split(':')[0]
              if pkg not in content:
                  content = content.replace('dependencies:', f'dependencies:\n  {d}')

          if 'flutter_launcher_icons:' not in content:
              content += '\ndev_dependencies:\n  flutter_launcher_icons: ^0.13.1\n\nflutter_launcher_icons:\n  android: \"launcher_icon\"\n  image_path: \"assets/images/icon.png\"\n  min_sdk_android: 21\n'

          if 'dependency_overrides:' not in content:
              content += '\ndependency_overrides:\n  file_picker: ^8.0.0\n  flutter_plugin_android_lifecycle: ^2.0.17\n'

          with open('pubspec.yaml', 'w', encoding='utf-8') as f:
              f.write(content)
          "
          rm -f pubspec.lock

      - name: Inject Android Permissions
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import os
          path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(path):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              perms = [
                  'INTERNET', 'CAMERA', 'READ_MEDIA_IMAGES',
                  'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION',
                  'CHANGE_WIFI_STATE', 'ACCESS_WIFI_STATE',
                  'BLUETOOTH', 'BLUETOOTH_ADMIN', 'BLUETOOTH_SCAN',
                  'BLUETOOTH_ADVERTISE', 'BLUETOOTH_CONNECT', 'NEARBY_WIFI_DEVICES'
              ]
              
              p_str = '\n'.join([f'    <uses-permission android:name=\"android.permission.{p}\" />' for p in perms])
              
              if 'INTERNET' not in content:
                  content = content.replace('<manifest', '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n' + p_str)
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
          "

      - name: Rewrite encryption_service.dart cleanly
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import glob

          complete_code = '''import 'dart:convert';
          import 'dart:typed_data';
          import 'dart:math';
          import 'package:cryptography/cryptography.dart';

          class EncryptionService {
            static final _algorithm = AesCbc.with256bits(macAlgorithm: Hmac.sha256());

            static String generateKey() {
              final random = Random.secure();
              final values = List<int>.generate(32, (i) => random.nextInt(256));
              return base64.encode(values);
            }

            static Future<String> encryptText(String text, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final secretBox = await _algorithm.encrypt(
                utf8.encode(text),
                secretKey: secretKey,
              );
              return base64.encode(secretBox.concatenation());
            }

            static Future<String> decryptText(String encryptedText, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final bytes = base64.decode(encryptedText);
              final secretBox = SecretBox.fromConcatenation(
                bytes,
                nonceLength: 12,
                macLength: 32,
              );
              final clearBytes = await _algorithm.decrypt(
                secretBox,
                secretKey: secretKey,
              );
              return utf8.decode(clearBytes);
            }

            static Future<List<int>> encryptFile(List<int> fileData, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final secretBox = await _algorithm.encrypt(
                fileData,
                secretKey: secretKey,
              );
              return secretBox.concatenation();
            }

            static Future<List<int>> decryptFile(List<int> encryptedData, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              return await _algorithm.decrypt(
                SecretBox.fromConcatenation(
                  encryptedData,
                  nonceLength: 12,
                  macLength: 32,
                ),
                secretKey: secretKey,
              );
            }
          }
          '''

          files = glob.glob('**/encryption_service.dart', recursive=True)
          for path in files:
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(complete_code)
          "

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build and Setup
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter create . --platforms=android
          
          python3 -c "
          import os
          props_path = 'android/gradle.properties'
          if os.path.exists(props_path):
              with open(props_path, 'a', encoding='utf-8') as f:
                  f.write('\nandroid.suppressUnsupportedCompileSdk=36\n')
          "

          python3 -c "
          import os
          root_gradle = 'android/build.gradle'
          if os.path.exists(root_gradle):
              with open(root_gradle, 'r', encoding='utf-8') as f:
                  g_content = f.read()
              
              sub_config = '''
          allprojects {
              subprojects {
                  afterEvaluate { project ->
                      if (project.hasProperty('android')) {
                          project.android {
                              compileSdkVersion 36
                              buildToolsVersion '34.0.0'
                          }
                      }
                  }
              }
          }
          '''
              if 'subprojects' not in g_content:
                  with open(root_gradle, 'a', encoding='utf-8') as f:
                      f.write(sub_config)
          "

          flutter pub get
          
          python3 -c "
          import glob, re, os
          pub_cache = os.path.expanduser('~/.pub-cache')
          for root, dirs, files in os.walk(pub_cache):
              for file in files:
                  if file == 'build.gradle':
                      file_path = os.path.join(root, file)
                      try:
                          with open(file_path, 'r', encoding='utf-8') as f:
                              c = f.read()
                          nc = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', c)
                          nc = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', nc)
                          if nc != c:
                              with open(file_path, 'w', encoding='utf-8') as f:
                                  f.write(nc)
                      except Exception:
                          pass
          "

          dart run flutter_launcher_icons || true
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-yemen-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
