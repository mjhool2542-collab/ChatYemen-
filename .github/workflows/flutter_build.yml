name: Flutter Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          unzip chat_yemen_2026_pro_finall.zip -d extracted_project
          PROJ_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Fix dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          
          python3 << 'PYTHON_SCRIPT'
          with open('pubspec.yaml', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # تعريف المكتبات
          deps = {
              'qr_flutter': '^4.1.0',
              'mobile_scanner': '^5.0.0',
              'permission_handler': '^11.3.0',
              'network_info_plus': '^5.0.1'
          }
          
          # إضافة المكتبات
          for dep, ver in deps.items():
              if dep not in content:
                  content = content.replace('dependencies:', f'dependencies:\n  {dep}: {ver}', 1)
                  print(f'Added {dep}')
              else:
                  print(f'{dep} already exists')
          
          # إضافة dev_dependencies
          if 'dev_dependencies:' not in content:
              content += '\ndev_dependencies:\n'
              print('Added dev_dependencies section')
          
          # إضافة flutter_launcher_icons
          if 'flutter_launcher_icons:' not in content:
              content = content.replace('dev_dependencies:', 'dev_dependencies:\n  flutter_launcher_icons: ^0.13.1')
              content += '\n\nflutter_launcher_icons:\n  android: "launcher_icon"\n  image_path: "assets/images/icon.png"\n  min_sdk_android: 21\n'
              print('Added flutter_launcher_icons')
          else:
              print('flutter_launcher_icons already exists')
          
          # حفظ الملف
          with open('pubspec.yaml', 'w', encoding='utf-8') as f:
              f.write(content)
          
          print('pubspec.yaml updated successfully')
          PYTHON_SCRIPT
          
          rm -f pubspec.lock
          mkdir -p assets/images assets/icons

      - name: Inject Permissions
        run: |
          cd ${{ env.PROJECT_DIR }}
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<manifest/a\
        <uses-permission android:name="android.permission.INTERNET" />\
        <uses-permission android:name="android.permission.CAMERA" />\
        <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\
        <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
              echo "Permissions added successfully"
            else
              echo "Permissions already exist"
            fi
          else
            echo "AndroidManifest.xml not found - skipping permissions"
          fi

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.0'

      - name: Install dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter pub get

      - name: Generate Launcher Icons
        run: |
          cd ${{ env.PROJECT_DIR }}
          
          mkdir -p assets/images
          
          if [ ! -f "assets/images/icon.png" ]; then
            echo "Creating dummy icon..."
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > assets/images/icon.png
          fi
          
          flutter pub run flutter_launcher_icons || echo "Icon generation skipped"

      - name: Build Android APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter build apk --release

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
