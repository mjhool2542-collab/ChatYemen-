name: Flutter Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          unzip chat_yemen_2026_pro_finall.zip -d extracted_project
          PROJ_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Fix pubspec and encryption code
        run: |
          cd ${{ env.PROJECT_DIR }}
          sed -i 's/nearby_connections: ^5.0.0/nearby_connections: any/g' pubspec.yaml
          sed -i 's/flutter_riverpod: .*/flutter_riverpod: any/g' pubspec.yaml
          rm -f pubspec.lock
          
          # إصلاح مسميات حزمة التشفير في كود Dart تلقائياً
          FILE="lib/services/encryption_service.dart"
          if [ -f "$FILE" ]; then
            sed -i 's/AesCbcWithPkcs7/AesCbc.with256bits/g' "$FILE"
            sed -i 's/Nonce(/SecretKey(/g' "$FILE"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies & Repairs Android files
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter create . --platforms=android
          flutter pub get

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
