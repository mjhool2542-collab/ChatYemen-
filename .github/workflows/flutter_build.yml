name: Flutter Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          unzip chat_yemen_2026_pro_finall.zip -d extracted_project
          PROJ_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Fix dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          with open('pubspec.yaml', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # قائمة المكتبات المراد إضافتها في حال عدم وجودها
          deps_to_add = {
              'qr_flutter': '  qr_flutter: ^4.1.0',
              'mobile_scanner': '  mobile_scanner: ^5.0.0',
              'permission_handler': '  permission_handler: ^11.3.0',
              'network_info_plus': '  network_info_plus: ^5.0.1'
          }
          
          # بناء النص الذي سيتم حقنه بناءً على العناصر غير الموجودة فقط
          new_deps = ''
          for lib, line in deps_to_add.items():
              if lib not in content:
                  new_deps += line + '\n'
          
          # إذا كانت هناك مكتبات جديدة لإضافتها، يتم حقنها أسفل dependencies: مباشرة
          if new_deps:
              content = content.replace('dependencies:', 'dependencies:\n' + new_deps.rstrip())
          
          # إضافة الأيقونات وأدوات التطوير مع التحقق من عدم التكرار
          if 'flutter_launcher_icons:' not in content:
              if 'dev_dependencies:' in content:
                  content = content.replace('dev_dependencies:', 'dev_dependencies:\n  flutter_launcher_icons: ^0.13.1')
              else:
                  content += '\ndev_dependencies:\n  flutter_launcher_icons: ^0.13.1'
              
              content += '\n\nflutter_launcher_icons:\n  android: \"launcher_icon\"\n  image_path: \"assets/images/icon.png\"\n  min_sdk_android: 21\n'
          
          with open('pubspec.yaml', 'w', encoding='utf-8') as f:
              f.write(content)
          "
          rm -f pubspec.lock
          mkdir -p assets/images assets/icons

      - name: Inject Permissions
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import os
          path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(path):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # يمكنك إكمال كود تعديل المانيفست هنا إذا لزم الأمر بشكل آمن
          "
