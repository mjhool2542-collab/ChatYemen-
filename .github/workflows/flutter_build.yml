      - name: Inject Permissions
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import os
          path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(path):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              perms = """<uses-permission android:name=\"android.permission.INTERNET\" />\n<uses-permission android:name=\"android.permission.CAMERA\" />\n<uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />"""
              if 'INTERNET' not in content:
                  content = content.replace('<manifest', '<manifest xmlns:android=\"http://android.com\">\n' + perms)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
          "
