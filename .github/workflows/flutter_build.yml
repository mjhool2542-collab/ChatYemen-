name: Flutter Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file
        run: |
          unzip chat_yemen_2026_pro_finall.zip -d extracted_project
          PROJ_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Fix dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          with open('pubspec.yaml', 'r', encoding='utf-8') as f:
              content = f.read()
          
          if 'qr_flutter' not in content:
              content = content.replace('dependencies:', 'dependencies:\n  qr_flutter: ^4.1.0\n  mobile_scanner: ^5.0.0\n  permission_handler: ^11.3.0\n  network_info_plus: ^5.0.1')
          
          if 'flutter_launcher_icons:' not in content:
              content += '\ndev_dependencies:\n  flutter_launcher_icons: ^0.13.1\n\nflutter_launcher_icons:\n  android: \"launcher_icon\"\n  image_path: \"assets/images/icon.png\"\n  min_sdk_android: 21\n'
          
          with open('pubspec.yaml', 'w', encoding='utf-8') as f:
              f.write(content)
          "
          rm -f pubspec.lock
          mkdir -p assets/images assets/icons

      - name: Inject Permissions
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import os
          path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(path):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              perms = '<uses-permission android:name=\"android.permission.INTERNET\" />\n<uses-permission android:name=\"android.permission.CAMERA\" />\n<uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />'
              if 'INTERNET' not in content:
                  content = content.replace('<manifest', '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n' + perms)
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
          "

      - name: Rewrite encryption_service.dart cleanly
        run: |
          cd ${{ env.PROJECT_DIR }}
          python3 -c "
          import glob

          complete_code = '''import 'dart:convert';
          import 'dart:typed_data';
          import 'dart:math';
          import 'package:cryptography/cryptography.dart';

          class EncryptionService {
            static final _algorithm = AesCbc.with256bits(macAlgorithm: Hmac.sha256());

            static String generateKey() {
              final random = Random.secure();
              final values = List<int>.generate(32, (i) => random.nextInt(256));
              return base64.encode(values);
            }

            static Future<String> encryptText(String text, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final secretBox = await _algorithm.encrypt(
                utf8.encode(text),
                secretKey: secretKey,
              );
              return base64.encode(secretBox.concatenation());
            }

            static Future<String> decryptText(String encryptedText, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final bytes = base64.decode(encryptedText);
              final secretBox = SecretBox.fromConcatenation(
                bytes,
                nonceLength: 12,
                macLength: 32,
              );
              final clearBytes = await _algorithm.decrypt(
                secretBox,
                secretKey: secretKey,
              );
              return utf8.decode(clearBytes);
            }

            static Future<List<int>> encryptFile(List<int> fileData, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              final secretBox = await _algorithm.encrypt(
                fileData,
                secretKey: secretKey,
              );
              return secretBox.concatenation();
            }

            static Future<List<int>> decryptFile(List<int> encryptedData, String key) async {
              final secretKey = SecretKey(utf8.encode(key.padRight(32, '0').substring(0, 32)));
              return await _algorithm.decrypt(
                SecretBox.fromConcatenation(
                  encryptedData,
                  nonceLength: 12,
                  macLength: 32,
                ),
                secretKey: secretKey,
              );
            }
          }
          '''

          files = glob.glob('**/encryption_service.dart', recursive=True)
          for path in files:
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(complete_code)
          "

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build and Setup
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter create . --platforms=android
          flutter pub get
          dart run flutter_launcher_icons || true
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-yemen-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
